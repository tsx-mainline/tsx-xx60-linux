name: rootfs
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # An arm64 runner. It runs the armv7 containers (docker --platform
    # linux/arm/v7) natively, so the job needs no qemu-user binfmt.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: build sendspin-cli from source (rootfs/src/sendspin/build.sh)
        run: rootfs/src/sendspin/build.sh

      # libtensorflowlite_c.so is a build product. It is not in the repo, and
      # the build of the rootfs needs it (rootfs/voice/install-lva.sh). The
      # script builds it in an armv7 container, natively on this runner.
      # TFLITE_CHECK=1 compares the result with the pin in
      # rootfs/voice/tflite/SHA256SUMS and stops when the sums differ. The
      # cache keeps the file between runs. install-lva.sh checks the pin again.
      - name: cache libtensorflowlite_c.so
        id: tflite
        uses: actions/cache@v4
        with:
          path: rootfs/voice/tflite/libtensorflowlite_c.so
          key: tflite-${{ hashFiles('rootfs/voice/build-tflite.sh', 'rootfs/voice/tflite/SHA256SUMS') }}

      - name: build libtensorflowlite_c.so (rootfs/voice/build-tflite.sh)
        if: steps.tflite.outputs.cache-hit != 'true'
        env:
          TFLITE_CHECK: "1"
        run: rootfs/voice/build-tflite.sh

      # No Crestron file is ever fetched or bundled here: TFA_VENDOR_FETCH=no
      # and TFA_VENDOR_SRC unset means mkrootfs.sh leaves the TFA9890 DSP
      # tuning containers out of the image entirely (a local build run by a
      # user, on their own machine, keeps fetching them by default). The
      # no-proprietary-files step below checks this on the build's output,
      # not just this env var.
      - name: build rootfs + initramfs (rootfs/build-rootfs.sh all)
        env:
          TFA_VENDOR_FETCH: "no"
        run: rootfs/build-rootfs.sh all

      - name: manifest / sizes / sha256
        run: |
          cat rootfs/out/rootfs.manifest
          cat rootfs/out/rootfs.sizes
          cat rootfs/out/rootfs.sha256

      - name: no proprietary files in the build output (ci/check-no-proprietary.sh)
        run: ci/check-no-proprietary.sh rootfs/out/rootfs.tar.gz rootfs/out/rootfs.ext4

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            rootfs/out/rootfs.tar.gz
            rootfs/out/rootfs.ext4
            rootfs/out/rootfs.manifest
            rootfs/out/rootfs.sizes
            rootfs/out/rootfs.sha256
            rootfs/out/initramfs-switchroot.cpio.gz
          if-no-files-found: error
