name: kernel
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # An arm64 runner. The Debian cross compiler (ci/Dockerfile.mainline) is
    # available for arm64 hosts, so the cross build runs there without change.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        flavor: [lts, stable]
    steps:
      - uses: actions/checkout@v4

      - name: cache the kernel fork checkout (${{ matrix.flavor }})
        uses: actions/cache@v4
        with:
          path: ../linux-${{ matrix.flavor }}
          key: linux-${{ matrix.flavor }}-${{ hashFiles(format('kernel/KERNEL_REV.{0}', matrix.flavor)) }}

      - name: build (tools/build/kbuild.sh --flavor ${{ matrix.flavor }}, clones ../linux-${{ matrix.flavor }} at kernel/KERNEL_REV.${{ matrix.flavor }} if not cached)
        run: tools/build/kbuild.sh --flavor ${{ matrix.flavor }} kernel image

      - name: kernelrelease / commit / sha256
        id: info
        run: |
          echo "release=$(cat ../out-${{ matrix.flavor }}/kernel.release)" >> "$GITHUB_OUTPUT"
          cat ../out-${{ matrix.flavor }}/kernel.release
          cat ../out-${{ matrix.flavor }}/kernel.commit
          cat ../out-${{ matrix.flavor }}/sha256sums.txt

      # upload-artifact refuses a path with "..", so the files of the build
      # (../out-<flavor>) are copied into the workspace first.
      - name: collect the files to upload
        run: |
          mkdir -p upload
          cp ../out-${{ matrix.flavor }}/* upload/
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.flavor }}-${{ steps.info.outputs.release }}
          path: upload
          if-no-files-found: error
