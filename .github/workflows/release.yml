name: release
on:
  push:
    tags:
      - 'v*'

# Nothing here downloads or bundles a Crestron file: the boot images, the
# rootfs, the rescue image and the v2 install payload are all built from this
# repo's own sources (rootfs/vendor-fetch.sh's proprietary DSP files are
# fetched by the PANEL itself at install time over the network, never bundled
# into a release asset).
#
# Job graph (each job runs on a plain ubuntu-latest runner, no --privileged
# and no loop-device mounts anywhere -- mk-tsxroot-emmc.sh builds its ext4
# with `mke2fs -d` straight from a directory tree, never a loopback mount):
#   kernel (matrix lts/stable) -> rescue -----\
#                               \-> rootfs ---> payload (matrix lts/stable) -> bundle -> publish
# rootfs and the armv7 initramfs steps need the qemu-user armv7 binfmt
# (docker/setup-qemu-action). The kernel build is a plain x86 cross-compile
# and needs no qemu. NOTE: GitHub's arm64 hosted runners (Azure Cobalt 100,
# an Armv9 core) most likely cannot execute armv7 (AArch32) code natively, so
# the armv7 steps would still need qemu there and would gain little. The x86
# runners are used for everything.
jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lts, stable]
    steps:
      - uses: actions/checkout@v4

      - name: cache the kernel fork checkout (${{ matrix.flavor }})
        uses: actions/cache@v4
        with:
          path: ../linux-${{ matrix.flavor }}
          key: linux-${{ matrix.flavor }}-${{ hashFiles(format('kernel/KERNEL_REV.{0}', matrix.flavor)) }}

      - name: build the kernel (tools/build/kbuild.sh --flavor ${{ matrix.flavor }})
        run: tools/build/kbuild.sh --flavor ${{ matrix.flavor }} kernel image

      - name: kernelrelease / commit / sha256
        id: info
        run: |
          echo "release=$(cat ../out-${{ matrix.flavor }}/kernel.release)" >> "$GITHUB_OUTPUT"
          cat ../out-${{ matrix.flavor }}/kernel.release
          cat ../out-${{ matrix.flavor }}/kernel.commit
          cat ../out-${{ matrix.flavor }}/sha256sums.txt

      # rootfs/build-rootfs.sh's own "modules" case: strips this flavor's
      # *.ko into rootfs/modules/lib/modules/<release>/ (uses the same
      # tsx-mainline docker image kbuild.sh just built/reused above, for the
      # strip step). Uploaded separately from the kernel artifact below so
      # the rootfs job (which needs BOTH flavors' modules but neither
      # flavor's zImage) does not have to pull either flavor's ~30 MiB
      # zImage/dtb pair for nothing.
      - name: this flavor's kernel modules tree (rootfs/build-rootfs.sh modules)
        run: KBUILD=../build-${{ matrix.flavor }} rootfs/build-rootfs.sh modules

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.flavor }}
          path: |
            ../out-${{ matrix.flavor }}/zImage
            ../out-${{ matrix.flavor }}/meson8m2-crestron-tsw1060.dtb
            ../out-${{ matrix.flavor }}/meson8m2-crestron-tsw760.dtb
            ../out-${{ matrix.flavor }}/kernel.release
            ../out-${{ matrix.flavor }}/kernel.commit
            ../out-${{ matrix.flavor }}/sha256sums.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.flavor }}
          path: rootfs/modules
          if-no-files-found: error

  # Rebuilt only when its own inputs change (installer/rescue*/**, the stage-2
  # initramfs pieces, or the lts kernel it happens to be packed with -- see
  # ci/build-rescue.sh's NOTE on why the flavor choice there is cosmetic).
  rescue:
    needs: [kernel, rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache the built rescue image
        id: cache
        uses: actions/cache@v4
        with:
          path: rescue-out
          key: rescue-${{ hashFiles('installer/rescue/**', 'installer/rescue-v2/**', 'installer/initramfs/**', 'rootfs/initramfs/**', 'rootfs/overlay/**', 'kernel/KERNEL_REV.lts') }}

      - name: register the armv7 qemu-user binfmt (docker --platform linux/arm/v7)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: kernel-lts
          path: ../out-lts

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: rootfs
          path: rootfs/out

      - name: ci/build-rescue.sh --kdir ../out-lts --flavor shared
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rescue-out
          ci/build-rescue.sh --kdir ../out-lts --flavor shared --out rescue-out/rescue.img

      - uses: actions/upload-artifact@v4
        with:
          name: rescue
          path: rescue-out
          if-no-files-found: error

  rootfs:
    needs: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache the built rootfs + initramfs
        id: cache
        uses: actions/cache@v4
        with:
          path: rootfs/out
          key: rootfs-${{ hashFiles('rootfs/**', 'kernel/KERNEL_REV.lts', 'kernel/KERNEL_REV.stable') }}

      - name: register the armv7 qemu-user binfmt (docker --platform linux/arm/v7)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          pattern: modules-*
          path: rootfs/modules
          merge-multiple: true

      # No Crestron file is ever fetched or bundled here: TFA_VENDOR_FETCH=no
      # and TFA_VENDOR_SRC unset means mkrootfs.sh leaves the TFA9890 DSP
      # tuning containers out of the image entirely (a local build run by a
      # user, on their own machine, keeps fetching them by default). The
      # no-proprietary-files step below checks this on the build's output,
      # not just this env var. KVER is left at its default (every release dir
      # under rootfs/modules/lib/modules -- both flavors, merged above), so
      # this ONE rootfs tarball carries both kernels' modules. See
      # installer/emmc/mk-tsxroot-emmc.sh's header for why the eMMC root
      # image built from it later keeps only one flavor's tree.
      - name: build the rootfs (rootfs/build-rootfs.sh rootfs)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TFA_VENDOR_FETCH: "no"
        run: rootfs/build-rootfs.sh rootfs

      - name: build the switch_root initramfs (rootfs/build-rootfs.sh initramfs)
        if: steps.cache.outputs.cache-hit != 'true'
        run: rootfs/build-rootfs.sh initramfs

      - name: manifest / sizes / sha256
        run: |
          cat rootfs/out/rootfs.manifest
          cat rootfs/out/rootfs.sizes
          cat rootfs/out/rootfs.sha256

      - name: no proprietary files in the build output (ci/check-no-proprietary.sh)
        run: ci/check-no-proprietary.sh rootfs/out/rootfs.tar.gz rootfs/out/rootfs.ext4

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            rootfs/out/rootfs.tar.gz
            rootfs/out/rootfs.ext4
            rootfs/out/rootfs.manifest
            rootfs/out/rootfs.sizes
            rootfs/out/rootfs.sha256
            rootfs/out/initramfs-switchroot.cpio.gz
          if-no-files-found: error

  # Assembles this flavor's slice of the v2 install payload: the compact eMMC
  # root image (content-sized, not partition-sized -- see
  # mk-tsxroot-emmc.sh's header for why) and this flavor's installed-system
  # boot image, bundled with a manifest + SHA256SUMS.
  payload:
    needs: [kernel, rootfs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lts, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.flavor }}
          path: ../out-${{ matrix.flavor }}

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: rootfs/out

      - name: this flavor's installed-system boot image (rootfs/mkbootimg.sh)
        env:
          KDIR: ../out-${{ matrix.flavor }}
        run: rootfs/mkbootimg.sh

      # --bytes is the eMMC "system/root" region size (2932 MiB, i.e. the
      # rest of a 4 GB Hynix device past the "boot" region -- see
      # docs/boot.md's eMMC region table). mk-tsxroot-emmc.sh refuses if the
      # compact image would not fit it, and records it in the manifest for
      # installer/steps/tsx-rescue-install's own sanity check.
      - name: this flavor's compact eMMC root image (installer/emmc/mk-tsxroot-emmc.sh)
        run: |
          mkdir -p payload-out
          installer/emmc/mk-tsxroot-emmc.sh \
            --rootfs-tar rootfs/out/rootfs.tar.gz \
            --modules-ver "$(cat ../out-${{ matrix.flavor }}/kernel.release)" \
            --bytes 3074424832 \
            --flavor ${{ matrix.flavor }} \
            --out payload-out/root.img

      - name: bundle root.img + boot.img + manifest (installer/emmc/mk-v2-bundle.sh)
        run: |
          installer/emmc/mk-v2-bundle.sh \
            --root-img payload-out/root.img \
            --boot-img rootfs/out/tsxboot.img \
            --flavor ${{ matrix.flavor }} \
            --out-dir payload-out/${{ matrix.flavor }}

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.flavor }}
          path: payload-out/${{ matrix.flavor }}
          if-no-files-found: error

  # A second, much smaller per-flavor asset for a DIFFERENT consumer than
  # "bundle"/"publish" below: tsx-aports' xx60/tsx-xx60-kernel-<flavor>
  # package, which needs the kernel's binary outputs (not the installed-system
  # payload) so its own CI (which has no build host to stage from) can build
  # the package by just downloading and verifying this one release asset.
  # Reuses artifacts the kernel/payload jobs already produced -- no rebuild:
  # zImage/dtb/kernel.release/kernel.commit from "kernel", this flavor's
  # modules tree from "kernel" (rootfs/build-rootfs.sh's separate "modules"
  # upload), and the already-packed boot image from "payload" (its boot.img
  # *is* this flavor's rootfs/out/tsxboot.img, packed by rootfs/mkbootimg.sh --
  # same file the tsx-aports package installs as /boot/tsxboot-emmc-<flavor>.img,
  # just renamed here to match what stage-kernel.sh has always called it).
  kbundle:
    needs: [kernel, payload]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [lts, stable]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ matrix.flavor }}
          path: ../out-${{ matrix.flavor }}

      - uses: actions/download-artifact@v4
        with:
          name: modules-${{ matrix.flavor }}
          path: rootfs/modules

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.flavor }}
          path: payload-${{ matrix.flavor }}

      - name: assemble the bundle (same 6 files stage-kernel.sh stages from a build host)
        run: |
          set -eu
          KREL=$(cat ../out-${{ matrix.flavor }}/kernel.release)
          OUT=kbundle-out
          mkdir -p "$OUT"
          cp ../out-${{ matrix.flavor }}/zImage "$OUT"/
          cp ../out-${{ matrix.flavor }}/meson8m2-crestron-tsw1060.dtb "$OUT"/
          cp ../out-${{ matrix.flavor }}/kernel.release "$OUT"/
          cp ../out-${{ matrix.flavor }}/kernel.commit "$OUT"/
          cp payload-${{ matrix.flavor }}/boot.img "$OUT"/tsxboot-emmc.img
          # rootfs/modules is exactly lib/modules/<KREL>/... (this flavor only,
          # per-flavor artifact) -- tar it up the same way modules_install +
          # `tar czf ... lib/modules` would on a build host.
          tar czf "$OUT/modules-$KREL.tar.gz" -C rootfs/modules lib
          (cd "$OUT" && sha256sum zImage meson8m2-crestron-tsw1060.dtb tsxboot-emmc.img "modules-$KREL.tar.gz" > CHECKSUMS.sha256)
          cat "$OUT/CHECKSUMS.sha256"
          tar --zstd -cf tsx-xx60-kernel-${{ matrix.flavor }}-bundle.tar.zst -C "$OUT" .
          ls -l tsx-xx60-kernel-${{ matrix.flavor }}-bundle.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: kbundle-${{ matrix.flavor }}
          path: tsx-xx60-kernel-${{ matrix.flavor }}-bundle.tar.zst
          if-no-files-found: error

  # Assembles installer/tsx-install-mainline's exact --payload DIR layout
  # (DIR/rescue.img, DIR/<flavor>/{root.img,boot.img,manifest,SHA256SUMS}) and
  # packs it as one archive per flavor (each self-sufficient: unpacking either
  # tarball alone gives a complete --payload DIR for that flavor). Per-flavor,
  # not one combined archive, because GitHub release assets cap out at 2 GiB
  # each and a combined archive (rescue + both ~940 MiB flavor dirs) would sit
  # too close to that ceiling as the rootfs grows.
  bundle:
    needs: [rescue, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rescue
          path: bundle

      - uses: actions/download-artifact@v4
        with:
          name: payload-lts
          path: bundle/lts

      - uses: actions/download-artifact@v4
        with:
          name: payload-stable
          path: bundle/stable

      - name: sanity-check the payload layout installer/tsx-install-mainline expects
        run: |
          set -eu
          for f in bundle/rescue.img bundle/lts/manifest bundle/lts/root.img bundle/lts/boot.img bundle/lts/SHA256SUMS \
                   bundle/stable/manifest bundle/stable/root.img bundle/stable/boot.img bundle/stable/SHA256SUMS; do
            [ -f "$f" ] || { echo "bundle: missing $f"; exit 1; }
          done
          (cd bundle/lts && sha256sum -c --quiet SHA256SUMS)
          (cd bundle/stable && sha256sum -c --quiet SHA256SUMS)
          echo "bundle: layout OK"

      - name: pack one archive per flavor (rescue.img + that flavor's dir), zstd-compressed
        run: |
          set -eu
          mkdir -p out
          for f in lts stable; do
            tar --zstd -cf out/tsx-xx60-$f-payload.tar.zst -C bundle rescue.img rescue.img.sha256 $f
            ls -l out/tsx-xx60-$f-payload.tar.zst
          done
          (cd out && sha256sum tsx-xx60-*-payload.tar.zst > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: out
          if-no-files-found: error

  publish:
    needs: [kernel, bundle, kbundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: collect the small kernel dev files (renamed per flavor)
        run: mkdir -p release/out release/k-lts release/k-stable

      - uses: actions/download-artifact@v4
        with:
          name: kernel-lts
          path: release/k-lts

      - uses: actions/download-artifact@v4
        with:
          name: kernel-stable
          path: release/k-stable

      - uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: release/out

      # tsx-aports' xx60/tsx-xx60-kernel-<flavor> package (source= a URL to
      # exactly this asset, pinned by tag + sha512sums) is the only consumer.
      # See the kbundle job above and tools/build/README.md.
      - uses: actions/download-artifact@v4
        with:
          name: kbundle-lts
          path: release/out

      - uses: actions/download-artifact@v4
        with:
          name: kbundle-stable
          path: release/out

      - name: rename the per-flavor kernel dev files into release/out
        run: |
          set -eu
          for f in lts stable; do
            cp release/k-$f/zImage release/out/zImage-$f
            cp release/k-$f/meson8m2-crestron-tsw1060.dtb release/out/meson8m2-crestron-tsw1060-$f.dtb
            if [ -f release/k-$f/meson8m2-crestron-tsw760.dtb ]; then cp release/k-$f/meson8m2-crestron-tsw760.dtb release/out/meson8m2-crestron-tsw760-$f.dtb; fi
            cp release/k-$f/kernel.release release/out/kernel.release-$f
            cp release/k-$f/kernel.commit release/out/kernel.commit-$f
          done
          (cd release/out && find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + | sort -k2 > SHA256SUMS)
          ls -l release/out

      - name: attach the build to the GitHub release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG=${{ github.ref_name }}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/out/* --clobber
