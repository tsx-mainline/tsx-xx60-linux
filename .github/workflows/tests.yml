name: tests
on:
  push:
  pull_request:

jobs:
  lint:
    name: syntax + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the test-runner image (busybox + bash + python3)
        run: docker build -t tsx-test -f ci/Dockerfile.test ci
      - name: ci/lint.sh - busybox sh -n, bash -n, py_compile, driver --help
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" tsx-test bash ci/lint.sh

  # These host tests exercise real code against fake sysfs/loopback devices or
  # (for the loop-device ones) their OWN "docker run --privileged" call --
  # they do not need a privileged job/container, just a runner with docker,
  # which ubuntu-latest already has. Any test that needs a real panel, a real
  # unit's captured backup, or Crestron's proprietary firmware SKIPS itself
  # (it checks CAPTURES_DIR / PUF_FILE / SYSIMG and prints "SKIPPED ..."); no
  # such input is provided here, so those tests report skipped, not failed.
  host-tests:
    name: host tests (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps (gcc for the fake-sysfs tests, libmpv for test-esphome.sh)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gcc libmpv2
      - name: kernel/tests/test-aml-dt.sh
        run: kernel/tests/test-aml-dt.sh
      - name: rootfs/tests/test-idled.sh
        run: rootfs/tests/test-idled.sh
      - name: rootfs/tests/test-idled-als.sh
        run: rootfs/tests/test-idled-als.sh
      - name: rootfs/tests/test-idled-runtime.sh - brightness offset, blank-timeout override, last-input
        run: rootfs/tests/test-idled-runtime.sh
      - name: rootfs/tests/test-als.sh
        run: rootfs/tests/test-als.sh
      - name: rootfs/tests/test-clock.sh - network time (chrony, DHCP NTP servers, boot clock floor)
        run: sh rootfs/tests/test-clock.sh
      - name: rootfs/tests/test-autoupdate-logic.sh
        run: sh rootfs/tests/test-autoupdate-logic.sh
      - name: rootfs/tests/test-autoupdate-flow.sh
        run: sh rootfs/tests/test-autoupdate-flow.sh
      - name: rootfs/tests/mqtt-dry.sh
        run: sh rootfs/tests/mqtt-dry.sh
      - name: rootfs/tests/test-buttons.sh
        run: rootfs/tests/test-buttons.sh
      - name: rootfs/tests/test-voice-esphome-run.sh - panel.conf PANEL_NAME override (tsx-voice-run, tsx-esphome-run)
        run: sh rootfs/tests/test-voice-esphome-run.sh
      - name: rootfs/tests/test-splash.sh - boot splash frames (image, status line, progress bar)
        run: sh rootfs/tests/test-splash.sh
      - name: rootfs/tests/test-confont.sh - console font by screen size, TSX - LINUX banners
        run: sh rootfs/tests/test-confont.sh
      - name: rootfs/tests/test-orientation.sh - screen orientation (table, sway/touch, turned splash, overlay layout)
        run: sh rootfs/tests/test-orientation.sh
      - name: rootfs/tests/test-tsx-config.sh
        run: rootfs/tests/test-tsx-config.sh
      - name: rootfs/tests/test-tsx-config-apply.sh
        run: rootfs/tests/test-tsx-config-apply.sh
      - name: rootfs/tests/test-panelctl.sh - reject hostile/malformed FIFO input
        run: rootfs/tests/test-panelctl.sh
      - name: rootfs/tests/test-setup.sh - on-panel setup page, LAN pairing, form validation, secrets never echoed
        run: rootfs/tests/test-setup.sh
      - name: rootfs/tests/test-esphome.sh - one Home Assistant device over the ESPHome API, plaintext and encrypted, both front ends
        run: rootfs/tests/test-esphome.sh
      - name: rootfs/tests/test-build-modules.sh - both flavors' module trees staged
        run: rootfs/tests/test-build-modules.sh
      - name: tools/build/tests/test-push-protect.sh - remote push keeps host-only inputs
        run: tools/build/tests/test-push-protect.sh
      - name: tools/build/tests/test-no-pull.sh - remote build can leave artifacts on the host
        run: tools/build/tests/test-no-pull.sh
      - name: rootfs/tests/mqtt-stop-timeout.sh - tsx-mqtt stops quickly with an unreachable broker
        run: sh rootfs/tests/mqtt-stop-timeout.sh
      - name: rootfs/tests/test-install.sh - docker --privileged, loop device
        run: rootfs/tests/test-install.sh
      - name: installer/tests/check-android-tools.sh
        run: installer/tests/check-android-tools.sh
      - name: installer/tests/test-mkpayload.sh
        run: installer/tests/test-mkpayload.sh
      - name: installer/tests/test-install-mainline-config.sh
        run: installer/tests/test-install-mainline-config.sh
      - name: installer/tests/test-install-mainline-dryrun.sh
        run: installer/tests/test-install-mainline-dryrun.sh
      - name: installer/tests/test-tsxdata-keep.sh - keep /data on a reinstall (file-backed ext4)
        run: installer/tests/test-tsxdata-keep.sh
      - name: installer/tests/test-boot-ok.sh - docker --privileged, loop device
        run: installer/tests/test-boot-ok.sh
      - name: installer/tests/test-tsx-data.sh - docker --privileged, loop device
        run: installer/tests/test-tsx-data.sh
      - name: installer/emmc/tests/test-root-fallback.sh - docker --privileged, loop device
        run: installer/emmc/tests/test-root-fallback.sh
      - name: installer/emmc/tests/test-usb-recovery.sh
        run: installer/emmc/tests/test-usb-recovery.sh
      - name: installer/tests/test-factory.sh - skips without PUF_FILE + CAPTURES_DIR
        run: installer/tests/test-factory.sh
      - name: installer/tests/test-sdcard.sh - skips without CAPTURES_DIR
        run: installer/tests/test-sdcard.sh
      - name: installer/tests/test-android-install.sh - skips without CAPTURES_DIR + SYSIMG
        run: installer/tests/test-android-install.sh
      - name: installer/factory/tests/test-emmc-generic.sh - skips without PUF_FILE
        run: installer/factory/tests/test-emmc-generic.sh
      - name: installer/factory/tests/test-emmc-restore.sh - skips without CAPTURES_DIR
        run: installer/factory/tests/test-emmc-restore.sh

  # rootfs/tests/qemu-virt.sh and rootfs/tests/qemu/run.sh boot a full kernel +
  # rootfs image under qemu-system-arm; they need kernel.yml's and rootfs.yml's
  # artifacts first and take several minutes, so they are not run on every
  # push/PR here. Run them by hand (or wire a workflow_dispatch job that
  # downloads those artifacts) when checking a change that touches boot or
  # the kiosk session.
