# TSX kiosk: the panel has no RTC. At boot, the clock starts at the last saved
# time. swclock sets it, and it is never earlier than the image build (see
# /etc/periodic/15min/tsx-savetime). As soon as chrony has an NTP server, it
# steps the clock. "makestep 1 -1" steps at any offset, on the first update.
#
# NTP servers from the DHCP lease (option 42) come first. The udhcpc hook
# tsx-dhcp-ntp writes them to /run/chrony-dhcp/*.sources ("prefer").
# The pool comes after them.
sourcedir /run/chrony-dhcp
pool pool.ntp.org iburst
makestep 1 -1
# No initstepslew. It runs before normal operation, with its own list of
# servers that chronyd resolves once at start. It gives up after about 10 s
# ("No suitable source for initstepslew") if those first requests get no
# answer. chronyd starts right after the DHCP lease, when the link and DNS
# are not quite ready. Only then did the pool sources start. "makestep" on
# the normal sources steps the clock just as early, without that trap.
driftfile /var/lib/chrony/chrony.drift
rtcsync
cmdallow 127.0.0.1
