# TSX kiosk: step the clock at any offset until synced (no RTC: the clock
# starts at the last saved time). No initstepslew: it holds back normal
# operation until it is done and, when its first requests go unanswered
# (network or DNS not quite up), cost ~10 s at boot before the pool sources
# even started; makestep steps on the first update after the iburst anyway.
pool pool.ntp.org iburst
makestep 1 -1
driftfile /var/lib/chrony/chrony.drift
rtcsync
cmdallow 127.0.0.1
