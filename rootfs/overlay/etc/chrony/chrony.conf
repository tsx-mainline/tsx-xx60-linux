# TSX kiosk: the panel has no RTC. At boot the clock starts at the last saved
# time (swclock; never earlier than the image build, see
# /etc/periodic/15min/tsx-savetime) and chrony steps it as soon as it has an
# NTP server: makestep 1 -1 steps at any offset, on the first update.
#
# NTP servers from the DHCP lease (option 42) first: tsx-dhcp-ntp (udhcpc
# hook) writes them to /run/chrony-dhcp/*.sources ("prefer"); then the pool.
sourcedir /run/chrony-dhcp
pool pool.ntp.org iburst
makestep 1 -1
# No initstepslew: it runs before normal operation, with its own list of
# servers resolved once when chronyd starts, and gives up after about 10 s
# ("No suitable source for initstepslew") when those first requests go
# unanswered -- chronyd starts right after the DHCP lease, while the link
# and DNS are not quite ready; only then did the pool sources start. makestep
# on the normal sources steps the clock just as early without that trap.
driftfile /var/lib/chrony/chrony.drift
rtcsync
cmdallow 127.0.0.1
