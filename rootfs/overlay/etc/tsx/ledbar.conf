# /etc/tsx/ledbar.conf: RGB LED bar of the xx60 (tsx-ledbar)
# After editing: rc-service tsx-ledbar restart
#
# Colors are R G B, each 0..100 (percent), e.g. "0 0 20" or "0,0,20".

# Color set at boot (0 0 0 = off)
BOOT_COLOR="0 0 0"

# The screen state never changes the bar. Old files may have BLANK and
# BLANK_DIM. The service ignores both keys and logs one line.

# Effects need the LED bar firmware TSX-LEDBAR (tsx-ledbar fw). The stock
# firmware ignores these keys. Empty = the firmware default.
#   FX_SMOOTH = ms to ramp each new color (0..60000, default 0 = at once)
#   FX_CAP    = power cap of the three colors in percent of one full
#               color (10..150, default 110)
FX_SMOOTH=
FX_CAP=
