# /etc/tsx/ledbar.conf: RGB LED bar of the xx60 (tsx-ledbar)
# After editing: rc-service tsx-ledbar restart
#
# Colours are R G B, each 0..100 (percent), e.g. "0 0 20" or "0,0,20".

# Colour set at boot (0 0 0 = off)
BOOT_COLOR="0 0 0"

# While tsx-idled has the screen blanked:
#   off  = bar dark, the colour comes back on wake (default)
#   dim  = the colour at BLANK_DIM percent
#   keep = unchanged (e.g. when the bar shows a room/occupancy status)
# A colour set while the screen is blank (ssh, MQTT) is stored and follows
# the same rule.
BLANK=off
BLANK_DIM=10
