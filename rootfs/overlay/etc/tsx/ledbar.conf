# /etc/tsx/ledbar.conf: RGB LED bar of the xx60 (tsx-ledbar)
# After editing: rc-service tsx-ledbar restart
#
# Colors are R G B, each 0..100 (percent), e.g. "0 0 20" or "0,0,20".

# Color set at boot (0 0 0 = off)
BOOT_COLOR="0 0 0"

# What the screen state of tsx-idled does to the bar:
#   keep = nothing, the bar follows only its own color and effects (default)
#   off  = bar dark while the screen is blank, the color comes back on wake
#   dim  = the color at BLANK_DIM percent while the screen is blank
# With off or dim, a color set while the screen is blank (ssh, MQTT) is
# stored and follows the same rule, and a screen change re-sends the color.
# A running effect stops while the screen is blank and starts again at the
# wake.
BLANK=keep
BLANK_DIM=10

# Effects need the LED bar firmware TSX-LEDBAR (tsx-ledbar fw). The stock
# firmware ignores these keys. Empty = the firmware default.
#   FX_SMOOTH = ms to ramp each new color (0..60000, default 0 = at once)
#   FX_CAP    = power cap of the three colors in percent of one full
#               color (10..150, default 110)
FX_SMOOTH=
FX_CAP=
