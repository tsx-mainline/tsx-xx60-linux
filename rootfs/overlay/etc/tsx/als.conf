# /etc/tsx/als.conf: ambient light sensor -> backlight (tsx-als)
# After editing: rc-service tsx-als restart
#
# The MAX44009 on i2c-1 (0x4a) sits behind the front glass. tsx-als reads it,
# smooths the value, maps lux to a backlight step with the curve below and
# hands the step to tsx-idled (/run/tsx/als-level). tsx-idled keeps blanking,
# the power key and the manual override (front keys "brightness +/-", the HA
# "Backlight" number): a manual level wins until the next day/night change or
# "Auto brightness" is switched on again.

# 1 = the sensor controls the backlight; 0 = only measure (lux still goes to
# MQTT) and tsx-idled uses the BRIGHTNESS_DAY/NIGHT schedule of /etc/kiosk.conf.
# Runtime switch without editing: tsx-als auto on|off (or the HA switch).
ALS_AUTO=1

# lux:step pairs, lux ascending. Between two points the step is interpolated
# linearly; below the first / above the last point the end values hold.
# Steps are MP3309C backlight steps (1..31, capped by BACKLIGHT_MAX=23 in
# kiosk.conf). Defaults: dark room 3, living room at night (~20 lx) 8,
# office (~300 lx) 17 = the U-Boot/vendor day level, bright daylight 23.
# The vendor firmware had no curve: it switched between High/Med/Low presets at
# two lux thresholds ("ALS low/high lux", libPlatform AutobrightnessManager).
ALS_CURVE="0:3 5:5 20:8 80:12 300:17 1000:21 3000:23"

# Seconds between readings.
ALS_INTERVAL=1
# Smoothing: exponential average over about N readings (1 = none).
ALS_SMOOTH=5
# Hysteresis: change the step only when the smoothed lux moved more than
# ALS_HYST_PCT percent (and at least ALS_HYST_ABS lux) away from the lux of the
# last change, and at most once per ALS_HOLD seconds.
ALS_HYST_PCT=25
ALS_HYST_ABS=2
ALS_HOLD=10
# Ramp: change the backlight one step every ALS_RAMP_MS milliseconds toward
# the new level (0 = jump; tsx-idled applies it within 5 s).
ALS_RAMP_MS=150

# Night cap: during NIGHT_START..NIGHT_END of /etc/kiosk.conf the ALS step is
# at most this (0 = no cap). 8 = the kiosk.conf night level.
ALS_NIGHT_CAP=0

# The sensor may see the panel's own backlight through the glass. Lux (x10)
# added per backlight step, subtracted from the reading: e.g. 5 = 0.5 lx per
# step. Measure: reading at step 17 minus reading at step 0 (screen blanked),
# divided by 17, times 10. 0 = no compensation.
ALS_BL_COMP=0

# MQTT (tsx-mqtt): report the lux when it changed by more than ALS_REPORT_PCT
# percent (at least 1 lx), and at least every ALS_REPORT_MAX seconds.
ALS_REPORT_PCT=10
ALS_REPORT_MAX=300

# IIO device: auto = the one named max44009; or a sysfs dir.
ALS_DEVICE=auto
