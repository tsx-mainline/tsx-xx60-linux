# /etc/tsx/als.conf: ambient light sensor -> backlight (tsx-als)
# After editing: rc-service tsx-als restart
#
# The MAX44009 on i2c-1 (0x4a) sits behind the front glass. tsx-als reads it
# and holds the value (see the response values below). It maps the lux to a backlight step with the curve
# below and hands the step to tsx-idled (/run/tsx/als-level).
# tsx-idled keeps the blanking, the power key and the manual override (front
# keys "brightness +/-", the HA "Backlight" number). A manual level wins
# until the next day/night change, or until "Auto brightness" is on again.

# panel.conf wins over this file for two settings: AUTO_BRIGHTNESS (on or off,
# in place of ALS_AUTO) and ALS_SCALE (lux = sensor lux x ALS_SCALE, in place
# of the ALS_SCALE below). tsx-config apply passes them on in /run/tsx/als.panel.
#
# 1 = the sensor controls the backlight.
# 0 = only measure (the lux still goes to MQTT). tsx-idled then uses the
#     BRIGHTNESS_DAY/NIGHT schedule of /etc/kiosk.conf.
# To switch at run time without editing: tsx-als auto on|off (or the HA switch).
ALS_AUTO=1

# lux:step pairs, lux ascending. Between two points, the step is interpolated
# linearly. Below the first point and above the last point, the end values hold.
# Steps are MP3309C backlight steps (1..31, capped by BACKLIGHT_MAX=23 in
# kiosk.conf). Defaults: dark room 3, living room at night (~20 lx) 8,
# office (~300 lx) 17 = the U-Boot/vendor day level, bright daylight 23.
# The vendor firmware had no curve. It switched between High, Med and Low
# presets at two lux thresholds ("ALS low/high lux", libPlatform
# AutobrightnessManager).
ALS_CURVE="0:3 5:5 20:8 80:12 300:17 1000:21 3000:23"

# Scale: lux = sensor lux x ALS_SCALE (0.01 to 1000). The front window passes
# only part of the light. Empty = 1.0. The panel.conf key ALS_SCALE wins.
ALS_SCALE=

# Response to the light, like the automatic brightness of a phone. The light
# must stay brighter for AUTO_BRIGHTEN_S seconds, or darker for AUTO_DARKEN_S
# seconds, before the step moves. A change must also be larger than a band in
# log10(1 + lux): AUTO_BRIGHTEN_BAND (0.06, about 15 percent) and
# AUTO_DARKEN_BAND (0.10, about 26 percent). A flash or a shadow that is
# shorter than the time changes nothing. kiosk.conf and panel-board.conf can
# set the same names, and they win over this file.
AUTO_BRIGHTEN_S=1.5
AUTO_DARKEN_S=5
AUTO_BRIGHTEN_BAND=0.06
AUTO_DARKEN_BAND=0.10
# Seconds between readings. The MAX44009 makes a new value every 0.8 s, so the
# value is never below ALS_MIN_PERIOD_S.
ALS_PERIOD_S=0.8
ALS_MIN_PERIOD_S=0.8
# A change of one step against the direction of the last change, within
# ALS_REVERSE_S seconds, needs twice the band. This stops a toggle between
# two steps of the 24 steps.
ALS_REVERSE_S=30
# Ramp: change the backlight one step every ALS_RAMP_MS milliseconds toward
# the new level (0 = jump). A full range takes about 1.4 s. tsx-idled applies
# the change within 5 s.
ALS_RAMP_MS=60
# Start: after a cold boot, the sensor can read 0 lx until its first
# conversion. The service skips up to this many readings of 0 lx before the
# first level. A dark room still gets its level after that.
ALS_START_WAIT=15

# Night cap: during NIGHT_START..NIGHT_END of /etc/kiosk.conf, the ALS step is
# at most this value (0 = no cap). 8 = the night level of kiosk.conf.
ALS_NIGHT_CAP=0

# The sensor can see the own backlight of the panel through the glass.
# ALS_BL_COMP is the lux (x10) per backlight step that the service subtracts
# from the reading. Example: 5 = 0.5 lx per step. To measure it, take the
# reading at step 17 minus the reading at step 0 (screen blanked). Divide by
# 17 and multiply by 10. 0 = no compensation.
ALS_BL_COMP=0

# MQTT (tsx-mqtt): report the lux when it changed by more than ALS_REPORT_PCT
# percent (at least 1 lx), and at least every ALS_REPORT_MAX seconds.
ALS_REPORT_PCT=10
ALS_REPORT_MAX=300

# IIO device: auto = the one named max44009. Or a sysfs dir.
ALS_DEVICE=auto
