# /etc/tsx/buttons-board.conf: the front keys of the xx60 (board layer of tsx-buttons)
# tsx-buttons reads this file before /etc/tsx/buttons.conf. A line in
# buttons.conf replaces the same setting or the same key of this file.
#
# The five capacitive keys right of the screen are zones of the touch
# controller. The kernel reports them as KEY_F13 (top) to KEY_F17 (bottom).
# Each key has an LED (led=1 to 5, in the same order). The names are the
# functions that the vendor printed on the glass, top to bottom (checked on the
# glass 2026-09-26).
#
# The keys have no local action. A press fires the Home Assistant event (the
# ESPHome event entity of the key and the event tsx_button) and does nothing
# else. A press on a blank screen only wakes the screen. Home Assistant sets
# the key LEDs and the screen-off level. To bind an action to a key, add an
# `on` line to /etc/tsx/buttons.conf.

# The LED class devices. All key LEDs share the PWM LED tsx:keypad for the
# brightness. Each key has its own enable LED tsx:key1 to tsx:key5.
LED_PWM=tsx:keypad
LED_KEY_PREFIX=tsx:key

# No slide along the keys. The brightness does not change when a finger passes
# over the keys, and a short press fires at once.
SLIDE_STEP=0

button power  KEY_F13 led=1
button home   KEY_F14 led=2
button lights KEY_F15 led=3
button up     KEY_F16 led=4
button down   KEY_F17 led=5
