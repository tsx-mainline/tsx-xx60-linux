# /etc/tsx/panel-board.conf: the values of the xx60 board
# (shell syntax). kiosk-session, the kiosk service, tsx-idled and tsx-cpufreq
# read it after /etc/kiosk.conf. A value in panel.conf still wins.
# After editing: rc-service kiosk restart, rc-service tsx-idled reload.

# GPU mode. browser = GLES in the compositor and GPU compositing in Chromium
# through ANGLE with an ES 2.0 context (the Mali-450 has no ES 3.0). This
# needs the patched Chromium. The kiosk hook kiosk.d/es2.sh adds this mode.
# See /etc/kiosk.conf for the other modes.
KIOSK_GPU=browser

# Backlight in steps of /sys/class/backlight/mp3309c (0..31 in mainline).
# The vendor firmware never goes above 23, so every level is clamped to it.
BACKLIGHT_MAX=23
BRIGHTNESS_DAY=17
BRIGHTNESS_NIGHT=8
# The lowest lit level. Slider, keys and auto stop here.
BACKLIGHT_MIN=1
# Response of the automatic brightness (tsx-als). Seconds that the light must
# stay brighter or darker, the band in log10(1 + lux), and the seconds between
# two readings (never below 0.8, the update time of the MAX44009). tsx-als
# reads the values again every 5 readings.
AUTO_BRIGHTEN_S=1.5
AUTO_DARKEN_S=5
AUTO_BRIGHTEN_BAND=0.06
AUTO_DARKEN_BAND=0.10
ALS_PERIOD_S=0.8

# CPU governor (tsx-cpufreq follows the screen state of tsx-idled).
CPUFREQ_AWAKE=performance
CPUFREQ_BLANK=schedutil
