# /etc/tsx/mqtt.conf: MQTT bridge to Home Assistant (tsx-mqtt)
# After editing: rc-service tsx-mqtt restart
#
# Empty BROKER = the bridge does not run (the service starts and exits quietly).
# The Crestron firmware can already hold an MQTT broker address. That is its
# own setting and has no link to this bridge. Set BROKER to the address of
# your own Home Assistant or MQTT broker.
# Values must not contain spaces (they go into mosquitto client option files).
# The keys MQTT_HOST, MQTT_PORT, MQTT_USER and MQTT_PASSWORD in panel.conf
# override BROKER, PORT, USER and PASSWORD here through /run/tsx/mqtt.conf.
# `tsx-config apply` applies them -- docs/rootfs.md "Panel configuration".
BROKER=
PORT=1883
USER=
PASSWORD=
# TLS: CA certificate file (and PORT=8883). Empty = plain MQTT
CAFILE=

# Home Assistant discovery prefix (HA default: homeassistant)
DISCOVERY_PREFIX=homeassistant
# Device id in topics and unique_ids (default: the hostname). Base topic
# for state/command topics (default: tsx/<NODE_ID>)
NODE_ID=
BASE_TOPIC=
# Device name shown in Home Assistant (default: "TSX <hostname>")
DEVICE_NAME=
