# /etc/tsx/voice.conf: Home Assistant Assist voice satellite (tsx-voice)
# After editing: rc-service tsx-voice restart
#
# voice: linux-voice-assistant 1.1.15 (OHF-Voice). It speaks the ESPHome
# native API like the Home Assistant Voice PE. Home Assistant finds it over
# zeroconf: Settings > Devices & services > ESPHome "TSX ..." (discovered).
# You can also add it by hand: ESPHome, host = panel IP, port 6053,
# encryption key = HA_API_KEY from panel.conf (tsx-config get HA_API_KEY.
# It prints None if the key is empty).
# HA needs an Assist pipeline with speech-to-text (Whisper add-on,
# Speech-to-Phrase or Home Assistant Cloud) and text-to-speech (Piper).
# Then set the wake word, sensitivity, mute, volume and pipeline on the HA
# device page. The satellite keeps them in STATE_DIR.
# It is not in a runlevel until you enable it: tsx-audio enable voice.

# Name shown in Home Assistant when PANEL_NAME (panel.conf) is unset
# (default: <hostname>). The ESPHome device name is then tsx-<mac>, the same
# as for tsx-esphome (docs/ha.md "One Home Assistant device"). You set the
# area in HA.
NAME=
PORT=6053

# How a conversation starts:
#   ptt   = push-to-talk only: "tsx-voice ptt" (bind it to a key in
#           /etc/tsx/buttons.conf: on lights long exec tsx-voice ptt), or
#           assist_satellite.start_conversation / announce from HA. The panel
#           runs no wake word inference (less CPU).
#   local = also an on-device wake word (microWakeWord, WAKE_WORD. You can
#           change it later on the HA device page) and the "stop" word
#           while a reply plays
WAKE=local
# okay_nabu, hey_jarvis, hey_mycroft, alexa, hey_home_assistant, okay_computer,
# hey_luna, hey_morgan, choo_choo_homie (microWakeWord). The openWakeWord
# models hey_jarvis_v0.1, ... use much more CPU on the Cortex-A9.
WAKE_WORD=okay_nabu

# 2026-09-26: WAKE=local is the default since the user added the ESPHome voice
# device in HA and expects the wake word. Measure CPU (voice open item).
# During a conversation, turn the "Media" volume (music, sendspin) down to
# this percentage and restore it afterwards. Empty = no ducking.
DUCK_MEDIA=20
# Feedback while listening: bar = RGB LED bar (tsx-ledbar), none.
# The satellite runs as user kiosk. "bar" needs the LED bar writable for
# group audio (see the audio report). Otherwise it silently does nothing.
LED=none
LED_COLOR="0 40 100"
# Sound at wake word or push-to-talk (empty = the own sounds of the assistant)
AWAKE_WAV=

# Audio: the ZL38051 already does echo cancellation and noise reduction. The
# "mic" PCM of /etc/asound.conf gives 16 kHz mono (ALSA resamples the shared
# 48 kHz capture). Replies and sounds go to "speaker" (Master). Music and
# announcements from the media player of HA go to "media" (Media + Master).
MIC_PCM=mic
SPEAKER_DEVICE=alsa/speaker
MUSIC_DEVICE=alsa/media
# yes = keep the output stream open between sounds (the upstream default). It
# keeps the speaker amplifiers enabled and dmix running all the time.
KEEP_OUTPUT_OPEN=no

# Network interface / address for the ESPHome API (empty = default route)
IFACE=
HOST=
# Local WebSocket API for peripherals (tsx-voice uses the FIFO instead)
PERIPHERAL_HOST=127.0.0.1
PERIPHERAL_PORT=6055
# Preferences (wake words, volume, mute) and downloaded wake word models
STATE_DIR=/var/lib/tsx-voice
# Extra arguments for linux-voice-assistant (e.g. --debug)
ARGS=
