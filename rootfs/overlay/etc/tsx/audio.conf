# /etc/tsx/audio.conf: TSW-1060 audio (tsx-audio)
# After editing: tsx-audio init   (re-applies the settings below)
#
# Kernel: sound card "TSW-1060" (ALSA id TSW1060): AIU I2S -> ZL38051 (flash
# config, AEC) -> 2x TFA9890 (DSP bypassed); microphones through the ZL38051
# into AUDIN. The speaker enable (GPIO_BSD_EN) is switched by the kernel with
# the playback stream; "tsx-audio speaker hold" keeps it on (silence) on demand.
# PCMs: /etc/asound.conf (default/speaker, media, mic).

CARD=TSW1060
# seconds to wait for the card at boot
CARD_WAIT=15
# saved mixer state (tsx-audio store; written at shutdown)
STATE=/var/lib/tsx/asound.state

# Levels used when there is no saved state (percent of the softvol range,
# linear in dB: Master 100 % = 0 dB cap in asound.conf = amps at -12 dBFS for
# a full-scale sample, 80 % = -10 dB, 50 % = -25 dB, 0 % = silence).
# Both stay at 100 %: the listening level is set in Music Assistant / Home
# Assistant (media_player volume -> sendspin-cli software gain). History:
# 40 % of a -50..-6 dB range was "very quiet", 80 % "good but could be louder".
MASTER_DEFAULT=100
MEDIA_DEFAULT=100

# Applied at every init (after the saved state):
# TFA9890 input slot. Both amplifiers take the left slot after probe.
LEFT_AMP_INPUT=Left
RIGHT_AMP_INPUT=Right
# ZL38051 AEC output to the SoC ("Mic Capture Switch") and the AEC itself
MIC=on
AEC=on
# "Mic Capture Volume" 0..15 (-24..+21 dB, 3 dB steps); empty = flash config (8 = 0 dB)
MIC_VOLUME=
