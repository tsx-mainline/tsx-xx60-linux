# /etc/tsx/audio.conf: TSW-1060 audio (tsx-audio)
# After editing: tsx-audio init   (re-applies the settings below)
#
# Kernel: sound card "TSW-1060" (ALSA id TSW1060): AIU I2S -> ZL38051 (flash
# config, AEC) -> 2x TFA9890 (DSP bypassed). The microphones go through the
# ZL38051 into AUDIN. The kernel switches the speaker enable (GPIO_BSD_EN)
# with the playback stream. "tsx-audio speaker hold" keeps it on (silence)
# on demand.
# PCMs: /etc/asound.conf (default/speaker, media, mic).

# The card name is TSX_SOUND_CARD in the board file. tsx-audio card prints it.
# seconds to wait for the card at boot
CARD_WAIT=15
# saved mixer state (tsx-audio store writes it at shutdown)
STATE=/var/lib/tsx/asound.state

# Levels used when there is no saved state. They are a percent of the softvol
# range, linear in dB. Master 100 % = the 0 dB cap in asound.conf = amps at
# -12 dBFS for a full-scale sample, 80 % = -10 dB, 50 % = -25 dB,
# 0 % = silence.
# Both stay at 100 %. Music Assistant or Home Assistant sets the listening
# level (media_player volume -> sendspin-cli software gain). History: 40 % of
# a -50..-6 dB range was "very quiet", and 80 % was "good but could be louder".
MASTER_DEFAULT=100
MEDIA_DEFAULT=100

# Applied at every init (after the saved state):
# TFA9890 input slot. Both amplifiers take the left slot after probe.
LEFT_AMP_INPUT=Left
RIGHT_AMP_INPUT=Right
# ZL38051 AEC output to the SoC ("Mic Capture Switch") and the AEC itself
MIC=on
AEC=on
# "Mic Capture Volume" 0..15 (-24..+21 dB, 3 dB steps). Empty = flash config (8 = 0 dB)
MIC_VOLUME=
