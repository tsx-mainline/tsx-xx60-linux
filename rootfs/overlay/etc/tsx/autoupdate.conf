# /etc/tsx/autoupdate.conf: automatic Alpine package updates (tsx-autoupdate)
# After editing: rc-service tsx-autoupdate restart
#
# Alpine's v3.24 branch has no separate security channel: every `apk
# upgrade` on a stable branch IS the security/bug-fix channel. This service
# runs it automatically, once a day, inside a night window and only while
# the screen is idle; it reboots only when the upgrade touched something
# that needs a reboot to take effect (kernel, musl, openrc, busybox/init).

# 1 = run automatically on the schedule below. 0 = the service still exists
# ("tsx-autoupdate now"/"status" still work), just no unattended installs.
ENABLED=1

# Local time window packages may be installed and the panel may reboot in,
# HH:MM-HH:MM. May cross midnight (e.g. 23:30-01:30).
WINDOW=03:00-05:00

# Chromium is pinned to an exact build (rootfs/packages.txt) so the ES2 GPU
# patch (rootfs/src/chromium-es2/) never silently breaks. When Alpine ships
# a newer Chromium with no known patch signature yet, it is held (logged as
# "held since ...") for this many days, then taken anyway -- unpatched,
# software rendering, clearly logged -- rather than held forever.
HOLD_DAYS=7

# auto  = reboot inside the window above when the day's upgrade touched the
#         kernel/modules, musl, openrc, or busybox/the init system.
# never = never reboot automatically; the status stays "reboot pending"
#         until someone reboots the panel by hand.
REBOOT=auto
