# /etc/tsx/autoupdate.conf: automatic Alpine package updates (tsx-autoupdate)
# After editing: rc-service tsx-autoupdate restart
#
# The v3.24 branch of Alpine has no separate security channel. Every `apk
# upgrade` on a stable branch IS the security and bug-fix channel. This
# service runs it automatically, once a day, inside a night window, and only
# while the screen is idle. It reboots only when the upgrade changed
# something that needs a reboot (kernel, musl, openrc, busybox or init).

# 1 = run automatically on the schedule below.
# 0 = the service still exists ("tsx-autoupdate now" and "status" still
#     work), but it installs nothing unattended.
ENABLED=1

# Local time window in which the service can install packages and reboot
# the panel, HH:MM-HH:MM. It can cross midnight (for example 23:30-01:30).
WINDOW=03:00-05:00

# Chromium is pinned to an exact build (rootfs/packages.txt), so the ES2 GPU
# patch (rootfs/src/chromium-es2/) never breaks silently. Alpine can ship a
# newer Chromium that has no known patch signature yet. The service holds
# that build (logged as "held since ...") for this many days. After that it
# installs the build anyway, unpatched, with software rendering, and logs
# this clearly. It never holds a build forever.
HOLD_DAYS=7

# auto  = reboot inside the window above when the upgrade of that day changed
#         the kernel or modules, musl, openrc, or busybox or the init system.
# never = never reboot automatically. The status stays "reboot pending"
#         until someone reboots the panel by hand.
REBOOT=auto
