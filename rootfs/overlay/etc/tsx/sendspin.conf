# /etc/tsx/sendspin.conf: Sendspin player for Music Assistant (tsx-sendspin)
# After editing: rc-service tsx-sendspin restart
#
# Enabled by default (dbus, avahi-daemon, tsx-sendspin, all in the default
# runlevel): tsx-audio disable sendspin turns it off, tsx-audio enable
# sendspin turns it back on.
#
# Binary: /usr/bin/sendspin-cli (Sendspin/sendspin-cpp-cli, the sendspin-cli
# package from this project's apk repository, tsx-aports); a rootfs built
# without that repository has /usr/local/bin/sendspin-cli instead (built by
# rootfs/src/sendspin/build.sh). Runtime packages: alsa-lib, avahi,
# avahi-compat-libdns_sd, dbus.

# Friendly name shown in Music Assistant (default: <hostname>)
SENDSPIN_NAME=
# Stable client id (Music Assistant files volume/grouping under it; default: from the MAC)
SENDSPIN_ID=
# ALSA output: the "media" PCM of /etc/asound.conf (dmix + Media softvol, so
# Assist TTS and notification sounds can play at the same time and duck it).
# Volume: Music Assistant / Home Assistant sets the player volume;
# sendspin-cli applies it in software as (volume/100)^1.5
# (100 % = 0 dB, 60 % = -6.7 dB, 50 % = -9 dB, 30 % = -15.7 dB) on top of the
# Media and Master softvols, which tsx-audio keeps at 100 % (see audio.conf).
SENDSPIN_OUTPUT=alsa:media
# Formats offered first. 48 kHz = the fixed I2S link rate (no resampling on the
# panel); 16 bit = the TFA9890/ZL38051 sample width.
SENDSPIN_FORMATS=flac:48000:16:2,pcm:48000:16:2
# Output buffer (ms). Raise if it stutters while Chromium renders.
SENDSPIN_BUFFER_MS=300
# Fixed delay (ms) added after the audio port, to line up with other players.
SENDSPIN_STATIC_DELAY=0
# Empty = advertise over mDNS (_sendspin._tcp via avahi) and wait for Music
# Assistant to connect; or host[:port] / mdns:<server name> to dial out.
SENDSPIN_SERVER=
# Extra arguments for sendspin-cli
SENDSPIN_ARGS=
