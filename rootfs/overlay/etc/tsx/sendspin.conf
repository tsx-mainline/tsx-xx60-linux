# /etc/tsx/sendspin.conf: Sendspin player for Music Assistant (tsx-sendspin)
# After editing: rc-service tsx-sendspin restart
#
# Enabled by default (dbus, avahi-daemon and tsx-sendspin, all in the default
# runlevel). "tsx-audio disable sendspin" turns it off. "tsx-audio enable
# sendspin" turns it on again.
#
# Binary: /usr/bin/sendspin-cli (Sendspin/sendspin-cpp-cli). It comes from
# the sendspin-cli package in the apk repository of this project (tsx-aports).
# A rootfs built without that repository has /usr/local/bin/sendspin-cli
# instead (rootfs/src/sendspin/build.sh builds it). Runtime packages:
# alsa-lib, avahi, avahi-compat-libdns_sd, dbus.

# Friendly name shown in Music Assistant (default: <hostname>)
SENDSPIN_NAME=
# Stable client id. Music Assistant files the volume and grouping under it.
# Default: derived from the MAC.
SENDSPIN_ID=
# ALSA output: the "media" PCM of /etc/asound.conf (dmix + Media softvol).
# With it, Assist TTS and notification sounds can play at the same time and
# duck the music.
# Volume: Music Assistant or Home Assistant sets the player volume.
# sendspin-cli applies it in software as (volume/100)^1.5
# (100 % = 0 dB, 60 % = -6.7 dB, 50 % = -9 dB, 30 % = -15.7 dB), on top of the
# Media and Master softvols. tsx-audio keeps those at 100 % (see audio.conf).
SENDSPIN_OUTPUT=alsa:media
# Formats offered first. 48 kHz = the fixed I2S link rate (no resampling on the
# panel). 16 bit = the TFA9890/ZL38051 sample width.
SENDSPIN_FORMATS=flac:48000:16:2,pcm:48000:16:2
# Output buffer (ms). Raise it if the audio stutters while Chromium renders.
SENDSPIN_BUFFER_MS=300
# Fixed delay (ms) added after the audio port, to line up with other players.
SENDSPIN_STATIC_DELAY=0
# Empty = advertise over mDNS (_sendspin._tcp through avahi) and wait for
# Music Assistant to connect. Or use host[:port] or mdns:<server name> to
# connect out.
SENDSPIN_SERVER=
# Extra arguments for sendspin-cli
SENDSPIN_ARGS=
