# Where the vendor U-Boot keeps the env that it actually READS on this unit.
# /usr/local/sbin/tsx-boot-ok uses it to reset boot_retry (and keep
# DataRecoveryDone=1) after a good boot.
#
# STATUS: VERIFIED AND ENABLED 2026-09-26 (ENV_VERIFIED=yes). The user approved
# the U-Boot hook and the boot_retry reset. Proof: the saveenv of U-Boot for
# the new tsx_boot/switch_bootmode changed only bytes 0x100000..0x10127c of
# mmcblk0, and the eMMC holds no copy (REPORT.md "U-Boot hook installed").
#
# On-panel scan 2026-09-26 (REPORT.md "On-panel results", read only):
#  - The live env is on the SD-class boot disk (mainline and Android
#    mmcblk0, the one with the Crestron MBR) at byte 0x100000 (= start of
#    p3). It is 64 KiB and the CRC32 is valid. Its golden_boot_retry went
#    0 (backup) -> 2 -> 3 -> 4 -> 5. This matches the U-Boot output "Golden
#    Reboot value set to N" on four consecutive boots. Its bootcmd is the
#    golden string that checkBootRetry() sets. So U-Boot reads and saves
#    THIS copy.
#  - The eMMC (mmcblk1: first 64 MiB, boot0, boot1) holds no env block and no
#    "boot_retry=" string. The earlier note "U-Boot ignores mmcblk0p3" was
#    wrong.
#
# ENV_VERIFIED=yes lets tsx-boot-ok WRITE the U-Boot env (fw_setenv) after
# every good boot. That is a U-Boot env write. Do it only with the explicit
# approval of the owner.
ENV_DISK=sd
ENV_OFFSET=0x100000
ENV_SIZE=0x10000
ENV_VERIFIED=yes
# tsx-boot-ok also keeps DataRecoveryDone=1. With it, the Crestron golden
# recovery image (p1:boot.img) does not format p5/p7 or empty /data if U-Boot
# ever falls back to it. no = leave DataRecoveryDone alone.
# If the key is unset (older copies of this file), the value is yes.
DEFUSE_GOLDEN=yes
