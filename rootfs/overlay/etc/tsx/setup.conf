# /etc/tsx/setup.conf: on-panel first-boot setup page (tsx-setupd,
# docs/rootfs.md "Setup page"). Read by tsx-setupd itself and by
# kiosk-session (only TSX_SETUP_PORT, to build the local URL it loads when
# unconfigured). After editing: rc-service tsx-setupd restart.

# Port tsx-setupd listens on for localhost (the kiosk itself always uses
# this). 8080 needs no special privilege, unlike port 80.
TSX_SETUP_PORT=8080

# Port used for LAN access from a laptop/phone (http://<panel-ip>:<port>/setup
# -- see docs/rootfs.md "Setup page" for why this is a separate, low, port
# rather than 80: tsx-setupd runs as root already like tsx-mqtt/tsx-esphome,
# but binding 80 as well as 8080 on every interface widens what a LAN client
# can reach for no real benefit here). Empty = LAN access is off entirely,
# even while unconfigured (localhost/the kiosk itself is unaffected).
TSX_SETUP_LAN_PORT=8080

# How long a pairing code (shown on the panel's own screen) and a LAN
# client's paired session each stay valid, in seconds. Also how long
# `tsx-config setup` / the overlay "Setup" entry keep the local setup page
# showing once the panel is otherwise configured.
TSX_SETUP_WINDOW=900
