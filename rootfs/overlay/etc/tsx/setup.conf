# /etc/tsx/setup.conf: on-panel first-boot setup page (tsx-setupd,
# docs/rootfs.md "Setup page"). tsx-setupd reads all of it. kiosk-session
# reads only TSX_SETUP_PORT, to build the local URL that it loads while the
# panel is unconfigured. After editing: rc-service tsx-setupd restart.

# Port that tsx-setupd listens on for localhost. The kiosk itself always uses
# this port. 8080 needs no special privilege, unlike port 80.
TSX_SETUP_PORT=8080

# LAN access from a laptop or phone (http://<panel-ip>:<TSX_SETUP_PORT>/setup,
# the same port -- see docs/rootfs.md "Setup page").
# on  = allowed while the panel is unconfigured or a Setup window is open,
#       and only with the pairing code shown on the panel.
# off = no LAN access at all, also while unconfigured. Localhost (the kiosk
#       itself) is not affected.
TSX_SETUP_LAN=on

# How long a pairing code (shown on the screen of the panel) and the paired
# session of a LAN client each stay valid, in seconds. This is also how long
# `tsx-config setup` and the overlay "Setup" entry keep the local setup page
# on screen when the panel is already configured.
TSX_SETUP_WINDOW=900
