# /etc/tsx/esphome.conf: standalone ESPHome native API server for the panel
# entities (tsx-esphome). It is used when VOICE=off -- see docs/ha.md "One
# Home Assistant device". After editing: rc-service tsx-esphome restart.
#
# When VOICE=on, the voice satellite (tsx-voice) serves these same entities
# itself, so Home Assistant discovers only one device. This daemon then
# stays enabled but idle (tsx-config apply stops it). The HA_TRANSPORT and
# VOICE keys of the panel config (tsx-config, panel.conf) control both.
# Do not change that choice here.

# Name shown in Home Assistant when PANEL_NAME (panel.conf) is unset
# (default: <hostname>). The ESPHome device name is then tsx-<mac>, the same
# as for the voice satellite. Encryption: HA_API_KEY in panel.conf.
NAME=
PORT=6053

# Network interface / address (empty = default route, like tsx-voice.conf).
IFACE=
HOST=

# Extra arguments for tsx_panel.esphome_server (e.g. --poll-interval 0.5).
ARGS=
