# /etc/tsx/tfa-dsp.conf: TFA9890 CoolFlux DSP loader (tsx-tfa-dsp).
# After editing: rc-service tsx-tfa-dsp restart   (or reboot)
#
# TFA_VARIANT: which vendor .cnt container to load, i.e. which speaker
# model/tuning the SPI NOR "hwparam" factory byte (offset 0x1f000, byte 3)
# selects:
#   0x00 or 0xFF -> yushan       (Jabil1005)          <- both units so far
#   0x01         -> yushan_2nd   (Jabil1223_Seltech2)
#   0x02         -> yushan_3rd   (Jabil0223_DS_SlimE)
# Container path: /usr/local/share/tsx/tfa9890/settings_$TFA_VARIANT/stereo.cnt
# (installed by mkrootfs.sh from the proprietary vendor tree; not published)
TFA_VARIANT=yushan

# TFA_VSTEP: DSP volume step (0..10, container-defined, roughly 3-4 dB
# apart). 0 is the vendor's own full-volume preset (0 dB); on unit A it
# measured about 6 dB quieter than steps 1/2 (a different preset/EQ, not
# just a gain change -- see the DSP bring-up notes ("Hardware bring-up")). The ALSA
# softvol (Master/Media, in tsx-audio) is the normal volume control; this is
# a second, DSP-side trim and is normally left at 0.
TFA_VSTEP=0

# TFA_PROFILE: container profile index (a speaker EQ/limiter set). 0 is the
# only profile in the yushan* containers seen so far.
TFA_PROFILE=0
