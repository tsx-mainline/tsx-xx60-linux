# /etc/tsx/tfa-dsp.conf: TFA9890 CoolFlux DSP loader (tsx-tfa-dsp).
# After editing: rc-service tsx-tfa-dsp restart   (or reboot)
#
# TFA_VARIANT: which vendor .cnt container to load. This is the speaker
# model and tuning that the SPI NOR "hwparam" factory byte (offset 0x1f000,
# byte 3) selects:
#   0x00 or 0xFF -> yushan       (Jabil1005)          <- both units so far
#   0x01         -> yushan_2nd   (Jabil1223_Seltech2)
#   0x02         -> yushan_3rd   (Jabil0223_DS_SlimE)
# Container path: /usr/local/share/tsx/tfa9890/settings_$TFA_VARIANT/stereo.cnt
# The container is proprietary and not published. The installer copies it
# from the stock firmware of the panel, or from rootfs/vendor-fetch.sh.
# The file SOURCE in that directory says which -- docs/install.md "TFA9890
# speaker DSP tuning".
TFA_VARIANT=yushan

# TFA_VSTEP: DSP volume step (0..10, defined by the container, roughly 3-4 dB
# apart). 0 is the full-volume preset of the vendor (0 dB). On unit A it
# measured about 6 dB quieter than steps 1 and 2. It is a different preset
# and EQ, not only a gain change -- see the DSP bring-up notes ("Hardware
# bring-up"). The normal volume control is the ALSA softvol (Master and
# Media, in tsx-audio). This DSP-side trim is a second control. Normally
# leave it at 0.
TFA_VSTEP=0

# TFA_PROFILE: container profile index (a speaker EQ and limiter set). 0 is
# the only profile in the yushan* containers seen so far.
TFA_PROFILE=0
