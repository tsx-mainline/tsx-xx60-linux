# /etc/asound.conf: TSW-1060 audio (audio; kernel sound card "TSW-1060",
# ALSA id TSW1060). Both directions share one I2S bus (AIU clocks, ZL38051
# flash configuration): 48 kHz, S16_LE, stereo, always.
#   hw:TSW1060,0  playback: AIU -> ZL38051 (passthrough) -> 2x TFA9890 -> speakers
#   hw:TSW1060,1  capture:  2 mics -> ZL38051 AEC/NR -> AUDIN (same signal on L and R)
#
# dmix/dsnoop name subdevice 0: a second client attaches to the open subdevice
# (O_APPEND), which the kernel refuses for "any subdevice" on multi-substream
# devices (found with the loopback card of the host test).
#
# PCMs for applications:
#   default / speaker  -> "Master" softvol -> dmix      (Chromium, TTS, sounds)
#   media              -> "Media" softvol -> Master     (sendspin: TTS can duck it)
#   mic                -> dsnoop, left slot, any rate/channels (plug converts;
#                         Assist uses 16 kHz mono)
#
# Speaker safety: the TFA9890s run with their DSP bypassed (no excursion or
# thermal protection). The ZL38051 flash config attenuates the amp feed by
# 12 dB (TDMB gain 0xF4, the same on stock Android), and "Master" is capped
# at 0 dB (max_dB), so a 0 dBFS sample reaches the amps at -12 dBFS at most:
# 6 dB above the 1 kHz -6 dBFS raw test tone the user called "loud", and 12 dB
# below what stock Android (DSP on, volume 15/15) sends them (DSP AGC gain
# ~3.95 = +12 dB, boost off, VBAT 4.9 V, DSP excursion 0.38 of its limit for a
# full-scale 1 kHz tone: the audio bring-up measurements). At -12 dBFS a 1 kHz sine is
# ~0.1 W into the 7 ohm speakers and about a quarter of that excursion.
# Volume is meant to come from Music Assistant: sendspin-cli scales its stream
# by (volume/100)^1.5 (MA 50 % = -9 dB), so Master and Media stay at 100 %.
# Master is linear in dB: 100 % = 0 dB, 80 % = -10 dB, 50 % = -25 dB.
# tsx-audio restores the saved levels at boot.
# softvol has no mute switch: 0 % is silence, 1 % is -50 dB (min_dB).
# Volume from Home Assistant: tsx-mqtt number "Volume" = Master in %.

pcm.tsx_dmix {
	type dmix
	ipc_key 51060
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:TSW1060,0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 8192
	}
	bindings { 0 0 1 1 }
}

pcm.tsx_master {
	type softvol
	slave.pcm "tsx_dmix"
	control { name "Master"; card TSW1060 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.tsx_media {
	type softvol
	slave.pcm "tsx_master"
	control { name "Media"; card TSW1060 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.tsx_dsnoop {
	type dsnoop
	ipc_key 51061
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:TSW1060,1,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 8192
	}
	bindings { 0 0 1 1 }
}

# the ZL38051 sends the same echo-cancelled signal on both slots: use the left
pcm.tsx_mic_mono {
	type route
	slave { pcm "tsx_dsnoop"; channels 2 }
	ttable.0.0 1
}

pcm.speaker {
	type plug
	slave.pcm "tsx_master"
	hint { show on; description "TSX speakers (Master volume, shared)" }
}
pcm.media {
	type plug
	slave.pcm "tsx_media"
	hint { show on; description "TSX speakers for music (Media + Master volume)" }
}
pcm.mic {
	type plug
	slave.pcm "tsx_mic_mono"
	hint { show on; description "TSX microphones (ZL38051 AEC output, mono, shared)" }
}

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mic"
}
ctl.!default { type hw; card TSW1060 }

# Opening these creates the "Master" / "Media" controls on the card without
# touching the hardware (tsx-audio does it at boot, before restoring levels).
# The parameters must stay identical to tsx_master / tsx_media above.
pcm.tsx_master_ctl {
	type softvol
	slave.pcm "null"
	control { name "Master"; card TSW1060 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
pcm.tsx_media_ctl {
	type softvol
	slave.pcm "null"
	control { name "Media"; card TSW1060 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
