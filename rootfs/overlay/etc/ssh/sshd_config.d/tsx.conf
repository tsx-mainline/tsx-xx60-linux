# xx60 kiosk sshd policy. The stock Alpine sshd_config includes this file
# early, so these values win over any later value in the base file.
# The policy is in one file, and not only in mkrootfs.sh sed edits, so it
# is easy to audit. Root password login stays on. A public image has no root
# password until the installer or the first console login sets one. An empty
# password never works over ssh, so until then ssh takes keys only
# (see /root/.ssh/authorized_keys and docs/rootfs.md "Root login").
PermitRootLogin yes
PermitEmptyPasswords no
PasswordAuthentication yes
PubkeyAuthentication yes
UseDNS no
Subsystem sftp internal-sftp
