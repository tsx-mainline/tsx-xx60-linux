# xx60 kiosk sshd policy (Include'd early by Alpine's stock sshd_config,
# so these values win over anything later in the base file; kept here rather
# than only as mkrootfs.sh sed edits so they're visible/auditable as one
# file). Root password login stays on until provisioning installs a key
# (see /root/.ssh/authorized_keys, carried over by r1/tsx-r1-migrate).
PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes
UseDNS no
Subsystem sftp internal-sftp
