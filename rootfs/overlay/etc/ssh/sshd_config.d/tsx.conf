# xx60 kiosk sshd policy. The stock Alpine sshd_config includes this file
# early, so these values win over any later value in the base file.
# The policy is in one file, and not only in mkrootfs.sh sed edits, so it
# is easy to audit. Root password login stays on until provisioning
# installs a key (see /root/.ssh/authorized_keys).
PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes
UseDNS no
Subsystem sftp internal-sftp
