# /etc/kiosk.conf: xx60 kiosk settings (shell syntax, read by the kiosk
# service, tsx-idled and kiosk-set-token). After editing:
#   rc-service kiosk restart     (browser settings)
#   rc-service tsx-idled reload  (blanking / brightness)

# Dashboard URL. The origin (scheme://host[:port]) is also what
# kiosk-set-token seeds the login token for.
# CHANGE THIS to your own Home Assistant URL. You can also leave it empty.
# The installer asks for a URL. If the installer or image skips the question,
# the value stays empty here on purpose. kiosk-session then shows the local
# setup page (docs/rootfs.md "Setup page"). A placeholder would point to a
# server that is not a real Home Assistant.
KIOSK_URL=""

# Browser: chromium (the only one installed by default).
KIOSK_BROWSER=chromium

# GPU:
#  auto    = GLES (cage) + GPU compositing (Chromium) when the drm/meson
#            display card and the Lima render node exist (primary path).
#            Otherwise pixman on simpledrm and software rendering in the
#            browser (fallback).
#  on      = force GLES everywhere.
#  compositor = GLES cage + software browser.
#  off     = pixman + software browser.
#  browser = GLES compositor + GPU compositing in Chromium through ANGLE on
#            GLES with an ES 2.0 context (--use-gl=angle --use-angle=gles
#            --ignore-gpu-blocklist --disable-webgl2). This needs the
#            patched Chromium ("tsx-chromium-es2 check"). Without it, the
#            browser renders in software.
# Default since 2026-09-26 (measured on the TSW-1060): browser.
# Scroll 7 -> 57 fps, idle CPU 8.7 -> 2.4 %, picture identical to software.
# In this mode, kiosk-session also turns off the ANGLE passthrough shaders.
# Without that, the page is black, because the Mali-450 has no vertex
# texture units.
# If the page is ever black or garbled, use KIOSK_GPU=auto (software, as before).
KIOSK_GPU=browser
# On the xx60 (Mali-450 = GLES 2.0), auto = GLES in the compositor and
# software rendering in Chromium (stock Chromium 152 needs GLES 3.0).

# Ask pages for reduced motion (CSS prefers-reduced-motion). HA then drops its
# animations. This matters with software rendering (47 % -> 3 % CPU on the
# login page). 0 = off.
KIOSK_REDUCED_MOTION=1

# On-screen keyboard (the panel has no keyboard):
#   squeekboard = sway + squeekboard (default). The keyboard slides up by
#                 itself when a text field gets focus. It hides when the
#                 field loses focus (tap the page outside the field). The
#                 page shrinks above the keyboard (1280x534 of 800, 1024x347
#                 of 600), so the field stays visible.
#   wvkbd       = sway + wvkbd: no automatic mode. The three-finger tap
#                 toggles it.
#   off         = cage + Chromium --kiosk as before (no keyboard).
# "tsx-osk show|hide|toggle|status" controls it from ssh (both variants).
KIOSK_OSK=squeekboard
# wvkbd height in pixels (squeekboard sizes itself: 266 px on 1280x800)
KIOSK_OSK_HEIGHT=300
# Quick-settings overlay (sway, that is KIOSK_OSK not off): brightness slider,
# auto brightness on/off, screen off, reload page, at the right screen edge.
# Slide a finger along the front-key strip to change the brightness (the
# slider shows while you slide). Hold the top key to show the full overlay.
# on | off.
KIOSK_OVERLAY=on
# tsx-idled: a quick tap with three fingers (all released within OSK_TAP_MS,
# no movement) runs OSK_TOGGLE_CMD. Use it to bring the keyboard up for a
# field that does not bring it up itself, or to put it away.
# threefinger | twofinger | off. (Two fingers also open the Chromium context menu.)
OSK_GESTURE=threefinger
OSK_TAP_MS=500
OSK_TOGGLE_CMD="/usr/local/bin/tsx-osk toggle"

# Extra browser flags. The service appends them last. A repeated switch
# overrides the earlier one.
# Presets (measured in the GPU/perf bring-up notes):
#   with KIOSK_GPU=browser (GPU rasterization is already on by default there):
#     "--disable-gpu-rasterization"   raster on the CPU, composite on the GPU
#                                     (same fps, a bit more renderer CPU)
#     "--enable-zero-copy"            no measurable gain
#     ("--use-gl=egl" does not exist in Chromium 152 on Linux: only ANGLE)
#   CPU preset (the default below). With the features list, it saves 1
#   renderer and 74 MiB PSS, and the idle CPU is lower:
#     "--num-raster-threads=4 --disable-smooth-scrolling --disable-background-networking --disable-domain-reliability --disable-breakpad"
KIOSK_EXTRA_FLAGS="--num-raster-threads=4 --disable-smooth-scrolling --disable-background-networking --disable-domain-reliability --disable-breakpad"
# Extra Chromium features to disable (comma list). The service appends it to
# the built-in --disable-features list. A second --disable-features flag
# would replace that list.
# CPU preset: "SpareRendererForSitePerProcess,Prerender2,BackForwardCache,HeavyAdIntervention,LensOverlay,GlobalMediaControls,OptimizationHintsFetching"
KIOSK_DISABLE_FEATURES="SpareRendererForSitePerProcess,Prerender2,BackForwardCache,HeavyAdIntervention,LensOverlay,GlobalMediaControls,OptimizationHintsFetching"

# CPU governor (tsx-cpufreq follows the screen state of tsx-idled):
# performance / schedutil / ondemand / powersave. CPUFREQ_AWAKE=off leaves
# the boot default (schedutil, tsx-setup). Apply a change with
# rc-service tsx-cpufreq reload.
# performance: the renderer CPU during scroll goes from 79 to 60 % of a core.
# The SoC reaches 58 C after 10 min (passive trip 80 C). See the browser REPORT.
# The top speed is the stock 1608 MHz. The DT no longer has the 1800 MHz
# boost OPP. It panicked the kernel under the own load of the kiosk
# (docs/hardware.md "SoC and CPU").
CPUFREQ_AWAKE=performance
CPUFREQ_BLANK=schedutil

# Remote DevTools on 127.0.0.1:9222. For a first login without a keyboard:
# run ssh -L 9222:127.0.0.1:9222 root@panel. Then open chrome://inspect in a
# desktop Chrome, use "Configure..." with localhost:9222, inspect the page
# and type into the screencast.
# 1 (default): the front keys (tsx-buttons home/navigate) use it for instant
# in-app navigation. It listens on 127.0.0.1 only. Reach it through ssh -L.
KIOSK_DEVTOOLS=1

# Force the Chromium --no-sandbox. The service adds it automatically when the
# kernel has no namespaces, which is the case for the current panel kernel.
KIOSK_NO_SANDBOX=0

# Browser profile (persistent: logins, localStorage and cookies survive reboots).
KIOSK_PROFILE=/var/lib/kiosk/chromium

# HTTP + compiled-script cache. The profile lives on the data partition (SD
# card). The cache is only a cache, so it goes on the root filesystem. On an
# eMMC install, small random reads are ~2.5x faster there (4 KiB direct reads:
# card 5.7 MB/s, eMMC 14 MB/s, unit B 2026-09-27). This speeds up the first
# page load after boot and after the daily restart. Empty = inside the
# profile, as before.
KIOSK_CACHE_DIR=/var/cache/kiosk

# Wait up to this many seconds for NTP sync before the browser starts. TLS
# certificates need the right date, and the panel has no RTC. The browser
# starts after the wait even without sync.
# Empty (default) = no wait when tsx-kiosk-reveal watches the page (sway
# session, KIOSK_DEVTOOLS=1, KIOSK_SPLASH=on). The browser then starts at
# once. If a page failed because of the clock, the service loads it again
# after NTP has synced (this saves up to 20 s at boot). Otherwise the
# default is 20.
KIOSK_TIME_WAIT=

# Boot splash handoff (sway session): the compositor background is the boot
# splash, and the browser window stays hidden until the page has painted
# (at most KIOSK_REVEAL_TIMEOUT seconds). off = black background, window at once.
KIOSK_SPLASH=on
KIOSK_REVEAL_TIMEOUT=60

# Daily browser restart (HH:MM, local time). It clears the slow memory leaks
# of a dashboard that runs for weeks. Empty = never.
KIOSK_RESTART_AT="04:00"

# Page zoom (1.0 = 100 %). Both panels (1280x800 10-inch, 1024x600 7-inch) use 1.0.
KIOSK_SCALE=1.0

# Screen blanking (tsx-idled): seconds without touch before the backlight goes
# off. 0 = never. The touch that wakes the screen is swallowed.
BLANK_TIMEOUT=300
SWALLOW_WAKE_TOUCH=1
WAKE_SWALLOW_MS=700

# Backlight in steps of /sys/class/backlight/mp3309c (0..31 in mainline).
# The vendor firmware never goes above 23 (24 on EDT glass) and U-Boot uses 17,
# so every level is clamped to BACKLIGHT_MAX. 0 = off (used only for blanking).
BACKLIGHT_MAX=23
BRIGHTNESS_DAY=17
BRIGHTNESS_NIGHT=8
# night hours, local time (NIGHT_START == NIGHT_END disables the night level)
NIGHT_START=22
NIGHT_END=7
# sysfs backlight directory, or auto (first in /sys/class/backlight)
BACKLIGHT=auto
# Power key (GPIOAO_3, gpio-keys-polled): blank = toggle screen off/on, ignore
POWER_KEY=blank

# Time zone (from /usr/share/zoneinfo), applied at boot.
TZ_NAME="America/Denver"
