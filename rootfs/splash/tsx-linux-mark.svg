<?xml version="1.0" encoding="UTF-8"?>
<!-- TSX-LINUX word mark: this project's own artwork (GPL-2.0-or-later, like
     the rest of the repository). Set in JetBrains Mono Bold (SIL Open Font
     License 1.1), which the build installs in its container (Alpine
     font-jetbrains-mono) before rsvg-convert renders this file
     (rootfs/splash/mksplash.sh checks that the font resolves; no fallback
     font). Font size 100: advance 60 units per character, cap height 73.
     "TSX" in the light tone, "-LINUX" in the accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 8 552 86" width="552" height="86">
  <text x="0" y="87" font-family="JetBrains Mono" font-weight="700" font-size="100"
        xml:space="preserve"><tspan fill="#e8ecf0">TSX</tspan><tspan fill="#3fa7e0">-LINUX</tspan></text>
</svg>
